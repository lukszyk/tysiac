<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licznik Punktów - Tysiąc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .card {
            background-color: #1e293b; /* slate-800 */
            border-radius: 0.75rem;
            padding: 0.75rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            transition: all 0.2s ease-in-out;
        }
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            text-align: center;
            transition: background-color 0.2s ease-in-out;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #14b8a6; /* teal-500 */
            color: white;
        }
        .btn-primary:hover {
            background-color: #0d9488; /* teal-600 */
        }
        .btn-secondary {
            background-color: #475569; /* slate-600 */
            color: #f1f5f9;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }
        .btn-disabled {
            background-color: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
            pointer-events: none;
        }
        .input-field {
            width: 100%;
            background-color: #334155;
            border: 1px solid #475569;
            color: #f1f5f9;
            padding: 0.4rem;
            border-radius: 0.5rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #14b8a6;
            box-shadow: 0 0 0 2px #14b8a680;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        #round-history-container table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }
        #round-history-container th, #round-history-container td {
            padding: 0.3rem 0.2rem;
            text-align: center;
        }
        #round-history-container th {
            background-color: #334155;
            font-weight: 600;
            border-bottom: 2px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        #round-history-container tr:nth-child(even) {
            background-color: #2d3846;
        }
        .history-score {
            font-weight: 600;
            color: #14b8aa;
        }
        .score-danger {
            color: #ef4444; /* red-500 dla 800+ */
        }
        .score-negative {
            color: #f87171; /* red-400 */
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-3">

    <div class="w-full max-w-4xl mx-auto">
        <header class="text-center mb-4">
            <h1 class="text-2xl font-bold text-teal-400">Licznik Punktów - Tysiąc</h1>
        </header>

        <!-- Ekran Ustawień Gry -->
        <div id="setup-screen" class="card space-y-3">
            <h2 class="text-lg font-semibold text-center">Nowa Gra</h2>
            <div>
                <label for="player-count" class="block mb-1 text-sm font-medium text-slate-300">Liczba graczy:</label>
                <select id="player-count" class="input-field">
                    <option value="2" selected>2 graczy</option>
                    <option value="3">3 graczy</option>
                    <option value="4">4 gracze</option>
                </select>
            </div>
            <div id="player-names-container" class="space-y-2"></div>
            <button id="start-game-btn" class="btn btn-primary w-full">Rozpocznij Grę</button>
        </div>

        <!-- Ekran Gry -->
        <div id="game-screen" class="hidden">
            <div id="status-message-container" class="text-center mb-4"></div>
            
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-2">
                <div id="round-info-display" class="bg-slate-700 p-2 rounded-lg text-center text-sm font-medium w-full sm:w-auto flex-grow"></div>
                <button id="rotate-first-player-btn" class="btn btn-secondary text-xs px-2 py-1 flex-shrink-0">
                    Ręcznie obróć gracza rozpoczynającego ♛
                </button>
            </div>
            
            <div id="scoreboard" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4"></div>
            
            <div class="card space-y-3 mb-4">
                <h3 class="text-base font-semibold">Dodaj punkty za rundę:</h3>
                <div id="score-inputs" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
                <button id="add-round-btn" class="btn btn-primary w-full">Dodaj Wynik Rundy</button>
            </div>

            <div class="card mb-4">
                <h3 class="text-sm font-semibold mb-2">Historia Rund:</h3>
                <div id="round-history-container" class="max-h-36 overflow-y-auto"></div>
            </div>

            <button id="back-to-menu-btn" class="btn bg-red-600 hover:bg-red-700 text-white w-full">Porzuć Grę / Nowa Gra</button>
        </div>

        <!-- Modal Zwycięzcy -->
        <div id="winner-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center p-4 z-40">
            <div class="card text-center space-y-3 max-w-sm w-full">
                <h2 class="text-xl font-bold text-teal-400">Koniec Gry!</h2>
                <p id="winner-message" class="text-base"></p>
                <div id="final-scores" class="text-left space-y-1 text-sm"></div>
                <button id="modal-back-to-menu-btn" class="btn btn-primary w-full">Powrót do Menu</button>
            </div>
        </div>

        <!-- Modal Potwierdzenia -->
        <div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center p-4 z-50">
            <div class="card text-center space-y-4 max-w-xs w-full">
                <p id="confirm-message" class="text-base font-medium"></p>
                <div class="flex gap-3 justify-center">
                    <button id="confirm-yes-btn" class="btn bg-red-600 hover:bg-red-700 text-white w-1/2">Tak</button>
                    <button id="confirm-no-btn" class="btn btn-secondary w-1/2">Anuluj</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const setupScreen = document.getElementById('setup-screen');
    const gameScreen = document.getElementById('game-screen');
    const winnerModal = document.getElementById('winner-modal');
    
    const confirmModal = document.getElementById('confirm-modal');
    const confirmMessage = document.getElementById('confirm-message');
    const confirmYesBtn = document.getElementById('confirm-yes-btn');
    const confirmNoBtn = document.getElementById('confirm-no-btn');

    const playerCountSelect = document.getElementById('player-count');
    const playerNamesContainer = document.getElementById('player-names-container');
    const startGameBtn = document.getElementById('start-game-btn');

    const scoreboard = document.getElementById('scoreboard');
    const scoreInputs = document.getElementById('score-inputs');
    const addRoundBtn = document.getElementById('add-round-btn');
    const backToMenuBtn = document.getElementById('back-to-menu-btn'); 
    const rotateFirstPlayerBtn = document.getElementById('rotate-first-player-btn');
    const roundHistoryContainer = document.getElementById('round-history-container');
    const modalBackToMenuBtn = document.getElementById('modal-back-to-menu-btn'); 
    
    const roundInfoDisplay = document.getElementById('round-info-display');
    const statusMessageContainer = document.getElementById('status-message-container');

    let gameState = {
        players: [],
        history: [],
        isActive: false,
        firstPlayerIndex: 0,
        initialFirstPlayerIndex: 0,
    };

    const GAME_STATE_KEY = 'tysiacGameState_local'; 
    const defaultPlayerNames = ['Kulik', 'Miś', 'Gracz 3', 'Gracz 4'];

    let messageTimeout;
    function showTemporaryMessage(message, isError = false) {
        statusMessageContainer.innerHTML = `
            <div class="p-2 rounded-lg ${isError ? 'bg-red-800 text-white' : 'bg-amber-600 text-white'} text-xs font-semibold">
                ${message}
            </div>
        `;
        clearTimeout(messageTimeout);
        messageTimeout = setTimeout(() => { statusMessageContainer.innerHTML = ''; }, 5000);
    }
    
    function renderRoundInfo() {
        if (!gameState.isActive) return;
        const currentRound = gameState.history.length + 1;
        const firstPlayerName = gameState.players[gameState.firstPlayerIndex].name;

        roundInfoDisplay.innerHTML = `
            <span class="text-slate-300">Runda: </span>
            <span class="text-teal-400 font-bold">${currentRound}</span> 
            <span class="text-slate-300 ml-4 hidden sm:inline-block">|</span>
            <span class="text-slate-300 ml-4">Na musiku: </span>
            <span class="text-amber-400 font-bold">${firstPlayerName}</span>
        `;
        
        const isRound1 = gameState.history.length === 0;
        rotateFirstPlayerBtn.classList.toggle('btn-disabled', !isRound1);
        rotateFirstPlayerBtn.disabled = !isRound1;
    }

    function recalculateScores() {
        gameState.players.forEach(player => player.score = 0);
        gameState.history.forEach(round => {
            gameState.players.forEach(player => {
                player.score += round[player.name] || 0;
            });
        });
        
        if (gameState.players.length === 2) {
            gameState.firstPlayerIndex = (gameState.history.length % 2 === 0) 
                ? gameState.initialFirstPlayerIndex 
                : (gameState.initialFirstPlayerIndex + 1) % 2;
        } else {
            const rotations = gameState.history.length % gameState.players.length;
            gameState.firstPlayerIndex = (gameState.initialFirstPlayerIndex + rotations) % gameState.players.length;
        }

        updateScoreValues();
        updateFirstPlayerMarker();
        renderRoundHistory();
        renderRoundInfo(); 
        saveGameState();
    }

    function addRoundScore() {
        const roundScores = {};
        let roundingOccurred = false; 

        for (let i = 0; i < gameState.players.length; i++) {
            const player = gameState.players[i];
            const input = document.getElementById(`score-input-${i}`);
            let scoreValue = parseInt(input.value, 10);
            
            if (isNaN(scoreValue) || input.value.trim() === '') {
                scoreValue = 0; 
            }

            if (Math.abs(scoreValue) > 360) {
                showTemporaryMessage(`Błąd: Maksymalna liczba punktów w rundzie to 360. Gracz "${player.name}" ma wpisane ${scoreValue}.`, true);
                input.focus();
                return;
            }

            if (scoreValue !== 0) {
                if (player.score >= 800 && scoreValue > 0 && scoreValue < 100) {
                    showTemporaryMessage(`Gracz z wynikiem 800+ (${player.name}) musi ugrać minimum 100 punktów.`, true);
                    input.focus();
                    return;
                }
                
                if (scoreValue > 0) {
                    let roundedScore = Math.round(scoreValue / 10) * 10;
                    if (roundedScore !== scoreValue) roundingOccurred = true;
                    scoreValue = roundedScore;
                }
            }

            roundScores[player.name] = scoreValue;
        }

        gameState.players.forEach(player => {
            player.score += roundScores[player.name];
        });
        
        gameState.history.unshift(roundScores);
        
        if (gameState.players.length === 2) {
            gameState.firstPlayerIndex = (gameState.history.length % 2 !== 0)
                ? (gameState.initialFirstPlayerIndex + 1) % 2
                : gameState.initialFirstPlayerIndex;
        } else {
            gameState.firstPlayerIndex = (gameState.firstPlayerIndex + 1) % gameState.players.length;
        }
        
        updateScoreValues();
        updateFirstPlayerMarker(); 
        renderRoundHistory();
        checkWinner();
        saveGameState();
        
        gameState.players.forEach((_, index) => {
            document.getElementById(`score-input-${index}`).value = '';
        });
        
        if (roundingOccurred) {
            showTemporaryMessage('Wprowadzony wynik dodatni został zaokrąglony do najbliższej 10-tki.', false);
        }
        
        renderRoundInfo(); 
        document.getElementById('score-input-0')?.focus();
    }

    function renderRoundHistory() {
        if (gameState.history.length === 0) {
            roundHistoryContainer.innerHTML = '<p class="text-slate-500 text-xs text-center p-2">Brak dodanych rund.</p>';
            return;
        }

        let headerHtml = '<tr><th class="w-1/6">Runda</th>';
        gameState.players.forEach(p => {
            const displayName = p.name.length > 5 ? p.name.substring(0, 5) + '.' : p.name;
            headerHtml += `<th class="whitespace-nowrap" title="${p.name}">${displayName}</th>`;
        });
        headerHtml += '<th class="w-1/12">Usuń</th></tr>';

        let bodyHtml = '';
        gameState.history.forEach((round, index) => {
            const roundNumber = gameState.history.length - index;
            let rowHtml = `<tr><td>${roundNumber}</td>`;
            
            gameState.players.forEach(p => {
                const score = round[p.name] || 0;
                const scoreClass = score < 0 ? 'score-negative' : 'history-score';
                rowHtml += `<td class="${scoreClass}">${score}</td>`;
            });

            rowHtml += `<td>
                <button onclick="confirmDeleteRound(${index})" class="text-red-400 hover:text-red-300 p-0.5 rounded" title="Usuń rundę">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mx-auto" viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd" />
                    </svg>
                </button>
            </td></tr>`;
            bodyHtml += rowHtml;
        });

        roundHistoryContainer.innerHTML = `<table><thead>${headerHtml}</thead><tbody>${bodyHtml}</tbody></table>`;
    }
    
    window.confirmDeleteRound = function(historyIndex) {
        showCustomConfirm('Czy na pewno chcesz usunąć tę rundę?', () => {
            gameState.history.splice(historyIndex, 1); 
            recalculateScores();
            checkWinner(); 
        });
    }

    function handleInputKeydown(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const currentIndex = parseInt(e.target.dataset.playerIndex, 10);
            const nextIndex = currentIndex + 1;

            if (nextIndex < gameState.players.length) {
                document.getElementById(`score-input-${nextIndex}`)?.focus();
            } else {
                addRoundBtn.click();
            }
        }
    }

    function renderGameScreen() {
        scoreboard.innerHTML = '';
        scoreInputs.innerHTML = '';
        gameState.players.forEach((player, index) => {
            const scoreCard = document.createElement('div');
            scoreCard.className = 'card text-center p-2.5'; 
            scoreCard.innerHTML = `
                <div id="player-name-${index}" class="text-xs font-semibold text-slate-300 flex items-center justify-center gap-1"></div>
                <div id="player-score-${index}" class="text-2xl font-bold mt-1 ${player.score >= 800 ? 'score-danger' : 'text-teal-400'}">${player.score}</div>
            `;
            scoreboard.appendChild(scoreCard);

            const inputContainer = document.createElement('div');
            inputContainer.innerHTML = `
                <label for="score-input-${index}" class="block mb-1 text-xs font-medium text-slate-400">${player.name}</label>
                <input type="number" id="score-input-${index}" class="input-field text-center text-sm font-bold" placeholder="0" data-player-index="${index}">
            `;
            scoreInputs.appendChild(inputContainer);
            
            document.getElementById(`score-input-${index}`)?.addEventListener('keydown', handleInputKeydown);
        });
        
        updateScoreValues();
        updateFirstPlayerMarker(); 
        renderRoundHistory();
        renderRoundInfo(); 
        document.getElementById('score-input-0')?.focus(); 
    }

    function updateScoreValues() {
        gameState.players.forEach((player, index) => {
            const scoreElement = document.getElementById(`player-score-${index}`);
            if (scoreElement) {
                scoreElement.textContent = player.score; 
                if (player.score >= 800) {
                    scoreElement.classList.add('score-danger');
                    scoreElement.classList.remove('text-teal-400');
                } else {
                    scoreElement.classList.remove('score-danger');
                    scoreElement.classList.add('text-teal-400');
                }
            }
        });
    }

    function updateFirstPlayerMarker() {
        gameState.players.forEach((player, index) => {
            const nameElement = document.getElementById(`player-name-${index}`);
            if (!nameElement) return;

            const isStartPlayer = (index === gameState.initialFirstPlayerIndex);
            const startStar = isStartPlayer ? '<span class="text-rose-400 font-normal mr-1" title="Start meczu">★</span>' : '';
            const musikBadge = (index === gameState.firstPlayerIndex) 
                ? '<span class="bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[9px] px-1 rounded font-black uppercase ml-1" title="Na musiku">M</span>' 
                : '';

            nameElement.innerHTML = `<span class="flex items-center justify-center">${startStar}<span>${player.name}</span>${musikBadge}</span>`;
        });
    }

    function generatePlayerNameInputs() {
        const count = parseInt(playerCountSelect.value, 10);
        playerNamesContainer.innerHTML = '';
        for (let i = 1; i <= count; i++) {
            const defaultName = defaultPlayerNames[i - 1] || `Gracz ${i}`;
            const div = document.createElement('div');
            div.innerHTML = `
                <label for="player${i}" class="block mb-1 text-xs font-medium text-slate-400">Imię gracza ${i}:</label>
                <input type="text" id="player${i}" class="input-field" placeholder="Gracz ${i}" value="${defaultName}">
            `;
            playerNamesContainer.appendChild(div);
        }
    }

    function startGame() {
        const playerCount = parseInt(playerCountSelect.value, 10);
        const players = [];
        let hasValidNames = true;

        for (let i = 1; i <= playerCount; i++) {
            const playerNameInput = document.getElementById(`player${i}`);
            const playerName = playerNameInput.value.trim();
            if (playerName === '') {
                playerNameInput.style.borderColor = '#f87171';
                hasValidNames = false;
            } else {
                playerNameInput.style.borderColor = '';
                players.push({ name: playerName, score: 0 });
            }
        }
        
        if (!hasValidNames) {
            showCustomAlert('Wszystkie pola z imionami muszą być wypełnione.');
            return;
        }

        gameState = { players, history: [], isActive: true, firstPlayerIndex: 0, initialFirstPlayerIndex: 0 };
        saveGameState(); 
        renderGameScreen();
        
        setupScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
    }

    function checkWinner() {
        const potentialWinners = gameState.players.filter(p => p.score >= 1000);
        if (potentialWinners.length > 0) {
            const winner = potentialWinners.reduce((prev, current) => (prev.score > current.score) ? prev : current);
            endGame(winner);
        }
    }

    function endGame(winner) {
        document.getElementById('winner-message').textContent = `Wygrywa ${winner.name}! Gratulacje!`;
        document.getElementById('final-scores').innerHTML = '<h4>Końcowe wyniki:</h4>' + [...gameState.players]
            .sort((a,b) => b.score - a.score)
            .map(p => `<div class="flex justify-between"><span>${p.name}:</span><span class="font-semibold">${p.score} pkt</span></div>`)
            .join('');

        winnerModal.classList.remove('hidden');
        winnerModal.classList.add('flex');
        clearGameState();
    }
    
    function resetGame() {
        clearGameState();
        gameScreen.classList.add('hidden');
        setupScreen.classList.remove('hidden');
        winnerModal.classList.add('hidden');
        winnerModal.classList.remove('flex');
        generatePlayerNameInputs();
    }

    function rotateFirstPlayer() {
        if (gameState.history.length > 0) { 
            showTemporaryMessage('Zmiana możliwa tylko w Rundzie 1.', true);
            return;
        }
        if (!gameState.isActive || gameState.players.length < 2) return;
        
        gameState.firstPlayerIndex = (gameState.firstPlayerIndex + 1) % gameState.players.length;
        gameState.initialFirstPlayerIndex = gameState.firstPlayerIndex;
        
        updateFirstPlayerMarker();
        renderRoundInfo(); 
        saveGameState(); 
    }

    function handleBackToMenu() {
        if (gameState.isActive) {
            showCustomConfirm('Czy na pewno chcesz porzucić obecną grę?', resetGame);
        } else {
            resetGame();
        }
    }

    function saveGameState() {
        if (gameState.isActive) {
            localStorage.setItem(GAME_STATE_KEY, JSON.stringify(gameState));
        }
    }

    function loadGameState() {
        const savedState = localStorage.getItem(GAME_STATE_KEY);
        if (savedState) {
            try {
                const loadedState = JSON.parse(savedState);
                if (loadedState.isActive && loadedState.players && loadedState.players.length > 0) {
                    gameState = loadedState;
                    renderGameScreen();
                    setupScreen.classList.add('hidden');
                    gameScreen.classList.remove('hidden');
                    return true;
                }
            } catch (e) {
                clearGameState();
            }
        }
        return false;
    }

    function clearGameState() {
        gameState = { players: [], history: [], isActive: false, firstPlayerIndex: 0, initialFirstPlayerIndex: 0 };
        localStorage.removeItem(GAME_STATE_KEY);
    }

    let currentYesHandler = null;
    let currentNoHandler = null;

    function showCustomAlert(message) {
        showCustomConfirm(message, () => {}, false); 
    }

    function showCustomConfirm(message, onConfirm, showNoButton = true) {
        confirmMessage.textContent = message;
        confirmModal.classList.add('flex');
        confirmModal.classList.remove('hidden');
        
        confirmNoBtn.classList.toggle('hidden', !showNoButton);
        if (!showNoButton) {
            confirmYesBtn.textContent = 'OK';
            confirmYesBtn.classList.remove('bg-red-600', 'hover:bg-red-700', 'w-1/2');
            confirmYesBtn.classList.add('btn-primary', 'w-full');
        } else {
            confirmYesBtn.textContent = 'Tak';
            confirmYesBtn.classList.add('bg-red-600', 'hover:bg-red-700', 'w-1/2');
            confirmYesBtn.classList.remove('btn-primary', 'w-full');
        }

        if (currentYesHandler) confirmYesBtn.removeEventListener('click', currentYesHandler);
        if (currentNoHandler) confirmNoBtn.removeEventListener('click', currentNoHandler);

        const cleanUp = () => {
            confirmModal.classList.add('hidden');
            confirmModal.classList.remove('flex');
            confirmYesBtn.removeEventListener('click', currentYesHandler);
            confirmNoBtn.removeEventListener('click', currentNoHandler);
            confirmYesBtn.textContent = 'Tak';
        };

        const handleYes = () => {
            cleanUp();
            if (showNoButton) onConfirm(); 
        };

        currentYesHandler = handleYes;
        currentNoHandler = cleanUp;
        
        confirmYesBtn.addEventListener('click', currentYesHandler);
        confirmNoBtn.addEventListener('click', currentNoHandler);
    }

    // REJESTRACJA ZDARZEŃ (EVENT LISTENERS)
    playerCountSelect.addEventListener('change', generatePlayerNameInputs);
    startGameBtn.addEventListener('click', startGame);
    addRoundBtn.addEventListener('click', addRoundScore);
    backToMenuBtn.addEventListener('click', handleBackToMenu);
    rotateFirstPlayerBtn.addEventListener('click', rotateFirstPlayer);
    modalBackToMenuBtn.addEventListener('click', resetGame);

    // Inicjalizacja
    if (!loadGameState()) {
        generatePlayerNameInputs();
    }
</script>
</body>
</html>
